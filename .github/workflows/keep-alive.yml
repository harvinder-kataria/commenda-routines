name: Keep Alive
on:
  schedule:
    - cron: "0 4 * * 1"  # 09:30 IST every Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat file
        run: |
          mkdir -p .github
          date -u +"Last keep-alive: %Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keep-alive heartbeat"
          git push
